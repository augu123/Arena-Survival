kind = "web"
previewPath = "/"
title = "Arena Survival"
description = "A third-person 3D action RPG: fight through five themed arenas with waves, bosses, hazards, character levels, perks and a between-level shop."
version = "1.0.0"
id = "artifacts/arena-survival"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21565

[services.development]
run = "pnpm --filter @workspace/arena-survival run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arena-survival", "run", "build" ]
serve = "static"
publicDir = "artifacts/arena-survival/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21565"
BASE_PATH = "/"
